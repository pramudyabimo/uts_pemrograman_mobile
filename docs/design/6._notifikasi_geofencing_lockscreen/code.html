<!-- Lockscreen Simulated Canvas -->

</div>
<!-- Ambient Gradient Scrim -->
<div class="absolute inset-0 bg-gradient-to-b from-inverse-surface/35 via-inverse-surface/20 to-inverse-surface/65 backdrop-blur-[1px]"></div>
<!-- Status & Lock Header -->
<div class="relative z-10 flex flex-col items-center pt-5 px-6">
<!-- Padlock Icon -->
<div class="flex items-center justify-center w-8 h-8 rounded-full bg-surface-pure/20 backdrop-blur-md mb-2">

        10:24

<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-pure/15 backdrop-blur-md mt-1"><span class="material-symbols-outlined text-primary-fixed-dim text-sm">near_me</span><span class="font-label-sm text-surface-pure tracking-normal">Geofencing Aktif — Wilayah Terdeteksi</span></div>
</div>
<!-- Notification Stack Area -->
<div class="relative z-10 px-4 mt-8 mb-14"><div class="w-full bg-surface-pure/95 backdrop-blur-xl rounded-2xl p-4 shadow-xl transition-all duration-300" id="pushBanner"><div class="flex items-center justify-between gap-2 pb-2"><div class="flex items-center gap-2"><div class="w-6 h-6 rounded-md bg-primary flex items-center justify-center shrink-0 text-on-primary"><span class="material-symbols-outlined text-sm">local_hospital</span></div><span class="font-label-sm font-semibold text-on-surface tracking-tight">Smart Village</span></div><span class="font-label-sm font-medium text-text-muted">Sekarang</span></div><div class="flex flex-col gap-2 mt-1"><div class="flex items-start gap-2.5"><div class="w-8 h-8 rounded-full bg-status-error-bg flex items-center justify-center text-status-error-text shrink-0 mt-0.5"><span class="material-symbols-outlined text-lg">location_on</span></div><div class="flex flex-col min-w-0 flex-1"><h2 class="font-headline-sm text-on-surface font-semibold leading-snug">Anda berada di area RSUD Kabupaten X</h2><p class="font-body-sm text-text-muted mt-0.5">Jarak Anda: 200 meter</p></div></div><div class="rounded-xl overflow-hidden bg-surface-subtle border border-border-subtle mt-1"><div class="w-full h-32 overflow-hidden relative"><img alt="RSUD Kabupaten X" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/AEtjO1UDuDWbLnmjmjvB2LsRKIfKiYi0LQU6xTPx6CFh8d2RKoLrHbyGqmZkfmZ4gx4dz2C0FOINtSBkGoAXYGjaElHLWhtApHrDErT5kQOqS3RB30JVFMr8ekZQROXoQSHYzbQtvi_l_Jct5MBBgDmDifkrIDk0dVamynV6KQ92OKeo722Qgkc4dOmLhxwI4g_gCsHFebLfVd8cYLKOtg0Yd3lJ0NiJk8LIQTDYsG0yrgE"><div class="absolute inset-0 bg-gradient-to-t from-inverse-surface/65 via-transparent to-transparent flex items-end p-2.5"><div class="flex items-center gap-1.5 text-surface-pure"><span class="material-symbols-outlined text-sm text-status-error-bg">near_me</span><span class="font-label-sm font-medium">Area Terdeteksi Otomatis</span></div></div></div></div></div></div></div>
<!-- Lockscreen Footer Controls -->
<div class="relative z-10 px-8 mt-auto flex flex-col items-center">
<!-- Quick Utility Buttons: Flashlight & Camera -->
<div class="w-full flex items-center justify-between mb-6">
<!-- Torch Shortcut -->
<button aria-label="Senter" class="w-12 h-12 rounded-full bg-surface-pure/25 backdrop-blur-lg flex items-center justify-center text-surface-pure active:bg-surface-pure/45 transition-colors shadow-sm" id="torchBtn">
<span class="material-symbols-outlined text-2xl">flashlight_on</span>
</button>
<!-- Dynamic Island / Interactive Pill indicator -->
<div class="px-3.5 py-1.5 rounded-full bg-surface-pure/20 backdrop-blur-md flex items-center gap-1.5 text-surface-pure"><span class="material-symbols-outlined text-sm text-status-success-bg">verified</span><span class="font-label-sm font-medium tracking-wide">Desa Tanggap Sehat</span></div>
<!-- Camera Shortcut -->
<button aria-label="Kamera" class="w-12 h-12 rounded-full bg-surface-pure/25 backdrop-blur-lg flex items-center justify-center text-surface-pure active:bg-surface-pure/45 transition-colors shadow-sm" id="cameraBtn">
<span class="material-symbols-outlined text-2xl">photo_camera</span>
</button>
</div>
<!-- Unlock Hint & Home Indicator Bar -->
<div class="flex flex-col items-center gap-2">
<p class="font-body-sm text-surface-pure/90 font-medium tracking-wider flex items-center gap-1 animate-pulse">
<span class="material-symbols-outlined text-base">expand_less</span>
          Geser ke atas untuk membuka
        </p>
<div class="w-36 h-1 rounded-full bg-surface-pure/80 mt-1"></div>
</div>
</div>
</div>
<!-- Micro-interaction script for playful tactile response -->
<script>
    (function() {
      const banner = document.getElementById('pushBanner');
      const torchBtn = document.getElementById('torchBtn');
      const cameraBtn = document.getElementById('cameraBtn');

      let torchActive = false;
      if (torchBtn) {
        torchBtn.addEventListener('click', function() {
          torchActive = !torchActive;
          if (torchActive) {
            torchBtn.classList.remove('bg-surface-pure/25', 'text-surface-pure');
            torchBtn.classList.add('bg-surface-pure', 'text-on-surface');
          } else {
            torchBtn.classList.add('bg-surface-pure/25', 'text-surface-pure');
            torchBtn.classList.remove('bg-surface-pure', 'text-on-surface');
          }
        });
      }

      if (banner) {
        banner.addEventListener('click', function(e) {
          if (!e.target.closest('button')) {
            banner.classList.add('scale-[0.98]');
            setTimeout(() => {
              banner.classList.remove('scale-[0.98]');
            }, 120);
          }
        });
      }
    })();
  </script>
