<script>
  // Filter chips selection handler
  const filterChips = document.querySelectorAll('.filter-chip');
  const markers = document.querySelectorAll('.pin-marker');

  filterChips.forEach(chip => {
    chip.addEventListener('click', () => {
      filterChips.forEach(c => {
        c.classList.remove('bg-primary-container', 'text-on-primary', 'font-medium');
        c.classList.add('bg-surface-pure', 'text-text-muted');
      });
      chip.classList.add('bg-primary-container', 'text-on-primary', 'font-medium');
      chip.classList.remove('bg-surface-pure', 'text-text-muted');

      const selectedCategory = chip.getAttribute('data-category');
      markers.forEach(marker => {
        const markerType = marker.getAttribute('data-type');
        if (selectedCategory === 'Semua' || markerType === selectedCategory) {
          marker.style.display = 'block';
        } else {
          marker.style.display = 'none';
        }
      });
    });
  });

  // Location pin click interaction updating bottom preview card
  const sheet = document.getElementById('facility-sheet');
  const sheetTitle = document.getElementById('sheet-title');
  const sheetTime = document.getElementById('sheet-time');
  const sheetStatus = document.getElementById('sheet-status');
  const closeSheet = document.getElementById('close-sheet');

  markers.forEach(marker => {
    marker.addEventListener('click', () => {
      const title = marker.getAttribute('data-title');
      const time = marker.getAttribute('data-time');
      const status = marker.getAttribute('data-status');
      const statusClass = marker.getAttribute('data-status-class');

      sheetTitle.textContent = title;
      sheetTime.textContent = time;
      sheetStatus.textContent = status;
      sheetStatus.className = 'px-2 py-0.5 rounded-full font-label-sm text-label-sm font-medium ' + statusClass;

      sheet.classList.remove('translate-y-32', 'opacity-0', 'pointer-events-none');
      sheet.classList.add('translate-y-0', 'opacity-100');
    });
  });

  closeSheet.addEventListener('click', () => {
    sheet.classList.add('translate-y-32', 'opacity-0', 'pointer-events-none');
    sheet.classList.remove('translate-y-0', 'opacity-100');
  });

  // Re-center pulse effect trigger
  const btnRecenter = document.getElementById('btn-recenter');
  const userAnchor = document.getElementById('user-location-anchor');

  btnRecenter.addEventListener('click', () => {
    userAnchor.classList.add('scale-125');
    setTimeout(() => {
      userAnchor.classList.remove('scale-125');
    }, 400);
  });
</script></main><nav class="fixed bottom-0 inset-x-0 z-50 pb-safe bg-surface-pure/90 backdrop-blur-xl shadow-[0_-2px_12px_rgba(17,24,39,0.04)]" data-active-classes="text-primary-container font-semibold"><div class="flex justify-around items-center h-16 px-gutter"><a class="flex flex-col items-center justify-center gap-space-xs min-w-[56px] min-h-[44px] text-text-muted hover:text-on-surface transition-colors" data-path="beranda" href="#"><span class="material-symbols-outlined text-[24px]">home</span><span class="font-label-sm text-label-sm">Beranda</span></a><a aria-current="page" class="flex flex-col items-center justify-center gap-space-xs min-w-[56px] min-h-[44px] transition-colors text-primary-container font-semibold" data-path="peta-faskes" href="#"><span class="material-symbols-outlined text-[24px]">location_on</span><span class="font-label-sm text-label-sm">Peta</span></a><a class="flex flex-col items-center justify-center gap-space-xs min-w-[56px] min-h-[44px] text-text-muted hover:text-on-surface transition-colors" data-path="fasilitas-favorit" href="#"><span class="material-symbols-outlined text-[24px]">favorite</span><span class="font-label-sm text-label-sm">Favorit</span></a><a class="flex flex-col items-center justify-center gap-space-xs min-w-[56px] min-h-[44px] text-text-muted hover:text-on-surface transition-colors" data-path="profil-warga" href="#"><span class="material-symbols-outlined text-[24px]">person</span><span class="font-label-sm text-label-sm">Profil</span></a></div></nav>
